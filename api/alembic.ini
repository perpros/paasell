# A generic Alembic configuration file.

[alembic]
# path to migration scripts
script_location = migrations

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Other alembic settings
prepend_sys_path = .
sqlalchemy.url = ${DATABASE_URL} # Will be picked from environment variables

# File generation template for new revisions
# file_template = %%(rev)s_%%(slug)s

# Enable support for PostGIS data types.
# postgis_options =

# Multidb support.
# databases =

# timezone for migration file names
# timezone =

# Revision filename length limit
# revision_environment = false

# Whether or not to output SQL to stdout when running offline.
# output_encoding = utf-8

# ... etc.
# Other configurations can be added as needed.
# Ensure you have `python-dotenv` installed if you want Alembic to pick up .env file for DATABASE_URL
# or ensure DATABASE_URL is set in the environment where alembic commands are run.
# For Dockerized environment, this will be passed from docker-compose.yml.

# Custom environment variables for Alembic
# These can be used in your env.py file
# my_custom_variable = some_value
